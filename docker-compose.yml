name: journal

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-journal}
      POSTGRES_USER: ${POSTGRES_USER:-journal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définis POSTGRES_PASSWORD dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: journal-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-journal}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-journal}
      APP_PASSWORD: ${APP_PASSWORD:?Définis APP_PASSWORD dans .env}
      SESSION_SECRET: ${SESSION_SECRET:?Définis SESSION_SECRET dans .env}
      JOURNAL_NAME: ${JOURNAL_NAME:-Mon journal}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      - uploads:/data/uploads
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:3000"

  # Sauvegarde automatique : base (pg_dump) + images, avec rotation.
  backup:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-journal}
      PGUSER: ${POSTGRES_USER:-journal}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - uploads:/data/uploads
      - ${BACKUP_DIR:-./backups}:/backups
      - ./backup:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/backup.sh", "loop"]

  # HTTPS automatique (Let's Encrypt) pour un VPS : docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to app:3000
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
