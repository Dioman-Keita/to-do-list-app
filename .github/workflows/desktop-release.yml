# Publier une version de l'application de bureau :
#   git tag desktop-v1.1.0 && git push origin desktop-v1.1.0
# -> construit l'installateur puis crée une Release GitHub avec le .exe en pièce jointe.
name: Publication de l'application de bureau

on:
  push:
    tags: ['desktop-v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ github.ref_name }}

  release:
    name: Release GitHub
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: journal-desktop-windows
          path: out

      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" out/*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "Journal pour Windows ${TAG#desktop-v}" \
            --generate-notes
